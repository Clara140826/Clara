<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Anlık Sohbet (E2EE & P2P)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        
        #chat-screen { display: none; flex-direction: column; height: 85vh; max-height: 650px; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; position: relative; font-size: 15px; animation: fadeIn 0.3s ease; }
        .msg.me { background: #0369a1; align-self: flex-end; color: #fff; }
        .msg.other { background: #334155; align-self: flex-start; color: #f8fafc; }
        .msg-meta { font-size: 11px; color: #94a3b8; margin-bottom: 2px; display: block; font-weight: bold; }
        .timer { font-size: 10px; color: #cbd5e1; display: block; text-align: right; margin-top: 4px; font-style: italic; }
        
        #input-area { display: flex; gap: 8px; align-items: center; }
        #msg-input { flex: 1; }
        #image-btn { background: #475569; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 6px; cursor: pointer; font-size: 20px; color: white; }
        #image-btn:hover { background: #64748b; }
        #file-input { display: none; }
        #chat-screen button { width: auto; padding: 0 20px; height: 45px; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-bottom: 10px; padding: 0 4px; }
        .status-online { color: #22c55e; font-weight: bold; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>Güvenli Giriş (P2P Anahtarı)</h2>
    <div class="input-group">
        <label>Kullanıcı Adınız (Nickname)</label>
        <input type="text" id="nickname" placeholder="Örn: Alice">
    </div>
    <div class="input-group">
        <label>Oda Anahtarı / Şifre (Ortak Olmalı)</label>
        <input type="password" id="room-crypto" placeholder="İkinizin de bildiği gizli şifre">
    </div>
    <button onclick="initializeConnection()">Odaya Bağlan</button>
</div>

<div class="container" id="chat-screen">
    <h2>Güvenli Sohbet Odası</h2>
    <div class="status-bar">
        <span>Durum: <span id="status" class="status-online">Bağlanılıyor...</span></span>
        <span style="color: #ef4444; font-weight: bold;">⚠️ LOG TUTULMAZ</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <label id="image-btn" for="file-input">📷</label>
        <input type="file" id="file-input" accept="image/*" onchange="sendImage(this)">
        <input type="text" id="msg-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') sendTextMessage()">
        <button onclick="sendTextMessage()">Gönder</button>
    </div>
</div>

<!-- Merkeziyetsiz veri akışı ve uçtan uca şifreleme kütüphaneleri -->
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>

<script>
    let gun, room, myNick, roomSecret;
    const messagesDiv = document.getElementById('messages');

    async function initializeConnection() {
        myNick = document.getElementById('nickname').value.trim();
        roomSecret = document.getElementById('room-crypto').value.trim();

        if (!myNick || !roomSecret) {
            alert("Lütfen bir takma ad ve ortak şifre belirleyin!");
            return;
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        // Dağıtık P2P Relay Sunucusu üzerinden eşleşme başlatılıyor
gun = Gun(['https://pagefront.app', 'https://herokuapp.com']);
        
        // Şifrenizi SHA-256 ile hashleyerek ağda kimsenin tahmin edemeyeceği gizli bir oda kanalı açıyoruz
        const hashedRoomId = await SEA.work(roomSecret, null, null, {name: 'SHA-256'});
        room = gun.get('secure-chat-p2p-' + hashedRoomId);

        document.getElementById('status').innerText = "Aktif (Uçtan Uca Şifreli)";

        // Gelen şifreli mesaj akışını dinleme
        room.map().on(async (data, id) => {
            if (!data) return;
            
            // Mesaj paketini cihazınızda ortak şifre ile çözme denemesi
            const decrypted = await SEA.decrypt(data.content, roomSecret);
            if (!decrypted) return; // Yanlış anahtarla sızmaya çalışan biriyse veriyi çözemez

            // Mesaj 60 saniyeden eskiyse arka planda ağdan kazı
            const age = Date.now() - data.timestamp;
            if (age >= 60000) {
                room.get(id).put(null);
                return;
            }

            if (document.getElementById(id)) return;
            displayMessage(id, data.sender, decrypted, data.type, data.timestamp);
        });
    }

    function displayMessage(id, sender, content, type, timestamp) {
        const isMe = sender === myNick;
        const msgEl = document.createElement('div');
        msgEl.id = id;
        msgEl.className = `msg ${isMe ? 'me' : 'other'}`;

        const meta = document.createElement('span');
        meta.className = 'msg-meta';
        meta.innerText = isMe ? "Siz" : sender;
        msgEl.appendChild(meta);

        if (type === 'text') {
            const txt = document.createElement('span');
            txt.innerText = content;
            msgEl.appendChild(txt);
        } else if (type === 'image') {
            const img = document.createElement('img');
            img.src = content;
            img.style.maxWidth = '100%';
            img.style.borderRadius = '4px';
            img.style.marginTop = '4px';
            msgEl.appendChild(img);
        }

        const countdown = document.createElement('span');
        countdown.className = 'timer';
        msgEl.appendChild(countdown);

        messagesDiv.appendChild(msgEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // 60 Saniyelik Kesin İmha Sayacı
        const interval = setInterval(() => {
            const remaining = Math.max(0, Math.ceil((60000 - (Date.now() - timestamp)) / 1000));
            countdown.innerText = `İmha ediliyor: ${remaining}sn`;

            if (remaining <= 0) {
                clearInterval(interval);
                msgEl.remove(); // Ekrandan kaldır
                room.get(id).put(null); // Dağıtık p2p veri havuzundan sonsuza dek sil
            }
        }, 500);
    }

    async function sendTextMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        await sendMessageData(text, 'text');
    }

    async function sendImage(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function (e) {
            await sendMessageData(e.target.result, 'image');
            fileInput.value = '';
        };
        reader.readAsDataURL(file);
    }

    async function sendMessageData(content, type) {
        // Gönderim anında tarayıcı içinde şifreleme (E2EE) yapılıyor
        const encryptedContent = await SEA.encrypt(content, roomSecret);
        
        const msgId = Gun.text.random();
        room.get(msgId).put({
            sender: myNick,
            content: encryptedContent,
            type: type,
            timestamp: Date.now()
        });
    }
</script>
</body>
</html>
