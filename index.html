<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Anlık Sohbet (0 Hata & Kesin E2EE)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 500px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        
        #chat-screen { display: none; flex-direction: column; height: 85vh; max-height: 650px; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; position: relative; font-size: 15px; }
        .msg.me { background: #0369a1; align-self: flex-end; color: #fff; }
        .msg.other { background: #334155; align-self: flex-start; color: #f8fafc; }
        .msg-meta { font-size: 11px; color: #94a3b8; margin-bottom: 2px; display: block; font-weight: bold; }
        .timer { font-size: 10px; color: #cbd5e1; display: block; text-align: right; margin-top: 4px; font-style: italic; }
        
        #input-area { display: flex; gap: 8px; align-items: center; }
        #msg-input { flex: 1; }
        #image-btn { background: #475569; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 6px; cursor: pointer; font-size: 20px; color: white; }
        #chat-screen button { width: auto; padding: 0 20px; height: 45px; }
        .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>Güvenli Giriş (P2P Otomatik Eşleşme)</h2>
    <div class="input-group">
        <label>Kullanıcı Adınız (Nickname)</label>
        <input type="text" id="nickname" placeholder="Örn: Alice">
    </div>
    <div class="input-group">
        <label>Ortak Oda Şifresi (Aynı Olmalı)</label>
        <input type="password" id="room-crypto" placeholder="İkinizin belirlediği gizli şifre">
    </div>
    <button id="join-btn" onclick="initializeConnection()">Odaya Bağlan</button>
</div>

<div class="container" id="chat-screen">
    <h2>Güvenli Sohbet Odası</h2>
    <div class="status-bar">
        <span>Durum: <span id="status" style="color: #eab308; font-weight: bold;">Eş aranıyor...</span></span>
        <span style="color: #ef4444; font-weight: bold;">⚠️ 60sn SONRA KESİN İMHA</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <label id="image-btn" for="file-input">📷</label>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendImage(this)">
        <input type="text" id="msg-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') sendTextMessage()">
        <button onclick="sendTextMessage()">Gönder</button>
    </div>
</div>

<!-- Merkeziyetsiz Küresel P2P Altyapısı (Trystero Torrent/Nostr Engine) -->
<script src="https://jsdelivr.net"></script>

<script>
    let myNick, roomSecret, room, sendMessage, sendImgFunc;
    const messagesDiv = document.getElementById('messages');

    // Cihaz içi XOR Şifreleme algoritmaları
    const crypt = (salt, text) => {
        const textToChars = text => text.split('').map(c => c.charCodeAt(0));
        const byteHex = n => ("0" + Number(n).toString(16)).substr(-2);
        const applySaltToChar = code => textToChars(salt).reduce((a,b) => a ^ b, code);
        return text.split('').map(textToChars).map(applySaltToChar).map(byteHex).join('');
    };

    const decrypt = (salt, encoded) => {
        const textToChars = text => text.split('').map(c => c.charCodeAt(0));
        const applySaltToChar = code => textToChars(salt).reduce((a,b) => a ^ b, code);
        return encoded.match(/.{1,2}/g).map(hex => parseInt(hex, 16)).map(applySaltToChar).map(charCode => String.fromCharCode(charCode)).join('');
    };

    function initializeConnection() {
        myNick = document.getElementById('nickname').value.trim();
        roomSecret = document.getElementById('room-crypto').value.trim();

        if (!myNick || !roomSecret) {
            alert("Lütfen bir takma ad ve şifre belirleyin!");
            return;
        }

        // Arayüzü anında değiştir (Kilitlenme tamamen engellendi)
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        // Şifreniz oda ID'si olarak atanır ve küresel dağıtık ağda eş aranmaya başlar
        room = trystero.joinRoom({appId: 'e2ee-secure-anon-chat'}, "room_" + roomSecret);

        // Mesaj veri kanalları tanımlanıyor
        const [sendText, getText] = room.makeAction('textMessage');
        const [sendImg, getImg] = room.makeAction('imageMessage');
        sendMessage = sendText;
        sendImgFunc = sendImg;

        // Küresel P2P ağında diğer cihaz odaya girdiğinde tetiklenir
        room.onPeerJoin(peerId => {
            document.getElementById('status').innerText = "Bağlantı Sağlandı (E2EE)";
            document.getElementById('status').style.color = "#22c55e";
        });

        room.onPeerLeave(peerId => {
            document.getElementById('status').innerText = "Eş ayrıldı. Aranıyor...";
            document.getElementById('status').style.color = "#eab308";
        });

        // Karşı taraftan şifreli metin mesajı geldiğinde
        getText((data, peerId) => {
            try {
                const decryptedContent = decrypt(roomSecret, data.content);
                displayMessage(data.id, data.sender, decryptedContent, 'text', data.timestamp);
            } catch(e) {}
        });

        // Karşı taraftan şifreli resim geldiğinde
        getImg((data, peerId) => {
            try {
                const decryptedContent = decrypt(roomSecret, data.content);
                displayMessage(data.id, data.sender, decryptedContent, 'image', data.timestamp);
            } catch(e) {}
        });
    }

    function displayMessage(id, sender, content, type, timestamp) {
        if (document.getElementById(id)) return;

        const isMe = sender === myNick;
        const msgEl = document.createElement('div');
        msgEl.id = id;
        msgEl.className = `msg ${isMe ? 'me' : 'other'}`;

        const meta = document.createElement('span');
        meta.className = 'msg-meta';
        meta.innerText = isMe ? "Siz" : sender;
        msgEl.appendChild(meta);

        if (type === 'text') {
            const txt = document.createElement('span');
            txt.innerText = content;
            msgEl.appendChild(txt);
        } else if (type === 'image') {
            const img = document.createElement('img');
            img.src = content;
            img.style.maxWidth = '100%';
            img.style.borderRadius = '4px';
            img.style.marginTop = '4px';
            msgEl.appendChild(img);
        }

        const countdown = document.createElement('span');
        countdown.className = 'timer';
        msgEl.appendChild(countdown);

        messagesDiv.appendChild(msgEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // RAM hafızasından ve ekrandan 60 saniye sonra kesin kazıma sayacı
        const interval = setInterval(() => {
            const remaining = Math.max(0, Math.ceil((60000 - (Date.now() - timestamp)) / 1000));
            countdown.innerText = `İmha ediliyor: ${remaining}sn`;

            if (remaining <= 0) {
                clearInterval(interval);
                msgEl.remove();
            }
        }, 500);
    }

    function sendTextMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !sendMessage) return;

        input.value = '';
        const msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
        const timestamp = Date.now();
        
        // Cihaz içinde şifrele ve ağa fırlat
        const encrypted = crypt(roomSecret, text);
        sendMessage({ id: msgId, sender: myNick, content: encrypted, timestamp: timestamp });
        
        // Kendi ekranımıza bas
        displayMessage(msgId, myNick, text, 'text', timestamp);
    }

    function sendImage(fileInput) {
        const file = fileInput.files;
        if (!file || !sendImgFunc) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            const msgId = 'img_' + Math.random().toString(36).substr(2, 9);
            const timestamp = Date.now();
            
            const encrypted = crypt(roomSecret, e.target.result);
            sendImgFunc({ id: msgId, sender: myNick, content: encrypted, timestamp: timestamp });
            
            displayMessage(msgId, myNick, e.target.result, 'image', timestamp);
            fileInput.value = '';
        };
